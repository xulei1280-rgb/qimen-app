<a class="skip" href="#main">跳到主要内容</a>
<div class="shell">
  <header class="masthead">
    <div class="eyebrow">文王卦 · 纳甲六爻</div>
    <h1>六爻问事</h1>
    <div class="sub">一事一问 · 先成卦，后解读</div>
    <nav class="module-nav" aria-label="术数模块">
      <a href="index.html">奇门</a><a href="bazi.html">八字</a><a href="liuyao.html" aria-current="page">六爻</a><a href="ziwei.html">紫微</a>
    </nav>
  </header>

  <div class="home-tabs" role="tablist" aria-label="六爻页面">
    <button type="button" id="tabCast" class="active" role="tab" aria-selected="true" onclick="showHome('cast')">起卦</button>
    <button type="button" id="tabHistory" role="tab" aria-selected="false" onclick="showHome('history')">复盘记录</button>
  </div>
  <div class="accessibility-tools"><button type="button" id="largeTextToggle" aria-pressed="false" onclick="toggleLargeText()">大字模式 · 关</button><span id="viewHint">桌面按所选模式显示</span></div>

  <main id="main">
    <section id="castHome" class="grid">
      <article class="card" id="questionCard">
        <div id="questionEditor">
          <div class="card-title"><div><div class="eyebrow">01 / 问事</div><h2>写清一件事</h2></div></div>
          <fieldset id="castFields" style="border:0;padding:0;margin:0">
            <div class="form-grid">
              <div class="field"><label for="askerMode">求测方式</label><select id="askerMode"><option value="self">本人求测</option><option value="other">代录他人卦象</option></select></div>
              <div class="field"><label for="gender">求测人性别</label><select id="gender"><option value="男">男</option><option value="女">女</option><option value="不透露">不透露</option></select></div>
              <div class="field"><label for="personName">姓名 / 标记（可选）</label><input id="personName" maxlength="40" placeholder="例如：自己、朋友甲"></div>
              <div class="field"><label for="questionType">问事类型</label><select id="questionType" onchange="renderQuestionTemplates()"><option value="career">事业工作</option><option value="wealth">财运交易</option><option value="love">感情关系</option><option value="cooperation">合作谈判</option><option value="travel">出行迁动</option><option value="lost">寻找失物</option><option value="other">其他具体事项</option></select></div>
              <div class="field full"><label for="castTime">起卦时间（北京时间）</label><div class="time-row"><input id="castTime" type="datetime-local" step="60"><button class="secondary" type="button" onclick="useCurrentTime()" aria-label="使用当前北京时间">现在</button></div></div>
              <div class="field full"><label for="question">本卦只问这一件事</label><textarea id="question" rows="3" maxlength="500" placeholder="例如：未来三个月，我是否适合接受目前这份工作邀请？" oninput="inspectQuestion()"></textarea>
                <details class="question-helper"><summary>不知道怎么问？</summary><div class="question-helper-body"><p class="hint">选择一个相近模板，再改成你的实际时间、对象和决定。模板不会自动起卦。</p><div id="questionTemplates" class="question-template-list"></div></div></details>
                <div id="questionGuidance" class="question-guidance" role="status" aria-live="polite" hidden><div id="questionGuidanceText"></div><label id="questionScopeConfirmWrap" class="scope-confirm"><input id="questionScopeConfirm" type="checkbox">我确认仍然只以其中一件具体事情起卦</label></div>
              </div>
            </div>
          </fieldset>
          <p class="hint">起卦开始后，问题和占时会锁定。医疗、法律和高风险投资只能作传统象意参考。</p>

          <div class="cast-methods">
            <button type="button" id="btnStep" onclick="drawNextLine()">逐爻摇卦</button>
            <button type="button" id="btnQuick" onclick="quickCast()">一键成卦</button>
            <button type="button" id="btnManualToggle" onclick="toggleManual()">手动录入</button>
          </div>

          <div id="stepBox" class="step-box" hidden>
            <div class="step-head"><strong id="stepTitle">准备摇初爻</strong><button type="button" class="secondary" onclick="cancelStepCast()">取消</button></div>
            <div id="stepLines" class="step-lines" aria-live="polite"></div>
          </div>

          <div id="manualBox" class="manual-box" hidden>
            <div class="card-title"><h3>按初爻到上爻录入</h3></div>
            <div id="manualGrid" class="manual-grid"></div>
            <button type="button" id="btnManualBuild" class="action" style="width:100%;margin-top:10px" onclick="manualCast()">生成卦象</button>
          </div>
          <div id="castStatus" class="status" role="status" aria-live="polite"></div>
        </div>
        <div id="questionSummary" class="question-summary" hidden></div>
      </article>

      <article class="card" id="plateCard">
        <div id="blankPlate" class="blank"><div><div class="blank-mark">☷</div><strong>此刻尚未成卦</strong><div>写下问题，再逐爻摇卦、一键成卦，或录入已有卦象。</div></div></div>
        <div id="resultArea" hidden></div>
      </article>
    </section>

    <section id="historyHome" class="history-panel" hidden>
      <article class="card">
        <div class="card-title"><div><div class="eyebrow">卦例留痕</div><h2>复盘记录</h2></div></div>
        <div class="history-tools">
          <input id="historySearch" type="search" placeholder="搜索问题、姓名、卦名" oninput="renderHistory()">
          <select id="historyFilter" onchange="renderHistory()" aria-label="复盘状态"><option value="all">全部记录</option><option value="pending">待验证</option><option value="verified">已验证</option></select>
          <button class="secondary" type="button" onclick="exportRecords()">导出</button>
          <button class="secondary" type="button" onclick="document.getElementById('recordImport').click()">导入</button>
          <input id="recordImport" type="file" accept="application/json,.json" hidden onchange="importRecords(this)">
        </div>
        <details class="history-advanced">
          <summary>高级筛选</summary>
          <div class="history-filter-grid">
            <label>问事类型<select id="historyTopic" onchange="renderHistory()"><option value="all">全部类型</option><option value="career">事业工作</option><option value="wealth">财运交易</option><option value="love">感情关系</option><option value="cooperation">合作谈判</option><option value="travel">出行迁动</option><option value="lost">寻找失物</option><option value="other">其他具体事项</option></select></label>
            <label>起卦方式<select id="historySource" onchange="renderHistory()"><option value="all">全部方式</option><option value="step">逐爻摇卦</option><option value="quick">一键成卦</option><option value="manual">手动录入</option></select></label>
            <label>起始日期<input id="historyDateFrom" type="date" onchange="renderHistory()"></label>
            <label>结束日期<input id="historyDateTo" type="date" onchange="renderHistory()"></label>
            <label>本卦<input id="historyPrimary" placeholder="例如：乾" oninput="renderHistory()"></label>
            <label>变卦<input id="historyChanged" placeholder="例如：坤" oninput="renderHistory()"></label>
            <label>动爻数量<select id="historyMoving" onchange="renderHistory()"><option value="all">全部数量</option><option value="0">0 · 静卦</option><option value="1">1 爻动</option><option value="2">2 爻动</option><option value="3">3 爻动</option><option value="4">4 爻动</option><option value="5">5 爻动</option><option value="6">6 爻全动</option></select></label>
            <div class="history-filter-actions"><button class="secondary" type="button" onclick="resetHistoryFilters()">清除筛选</button></div>
          </div>
        </details>
        <div class="local-note">记录和 AI 对话只保存在当前浏览器。换设备或清理浏览器前，请先导出备份。</div>
        <div id="historyStatus" class="status" role="status"></div>
        <div id="historyList" class="history-list"></div>
      </article>
    </section>
  </main>
</div>

<dialog id="termDialog" class="term-dialog" aria-labelledby="termTitle">
  <div class="term-dialog-inner">
    <h3 id="termTitle"></h3>
    <p id="termMeaning"></p>
    <p id="termReason"></p>
    <form method="dialog"><button class="secondary" type="submit">知道了</button></form>
  </div>
</dialog>

<script>
var API_KEY_STORAGE='qimen_deepseek_api_key';
var RECORDS_STORAGE='liuyao_records_v1';
var DISPLAY_STORAGE='liuyao_display_mode';
var TEXT_SIZE_STORAGE='liuyao_large_text';
var currentRecord=null,currentPlate=null,currentUseGodRelations=null,stepLines=[],stepMeta=null,aiRequestSeq=0,openedFromHistory=false,currentPlateFocus='all',preferredDisplayMode='standard';
var LINE_NAMES=['初爻','二爻','三爻','四爻','五爻','上爻'];
var LINE_VALUE_LABELS={6:'老阴 · 动',7:'少阳 · 静',8:'少阴 · 静',9:'老阳 · 动'};
var TOPIC_LABELS={career:'事业工作',wealth:'财运交易',love:'感情关系',cooperation:'合作谈判',travel:'出行迁动',lost:'寻找失物',other:'其他具体事项'};
var SOURCE_LABELS={step:'逐爻摇卦',quick:'一键成卦',manual:'手动录入'};
var QUESTION_TEMPLATES={
  career:[['接受工作邀请','未来三个月，我是否适合接受目前这份工作邀请？'],['离开目前岗位','在未来三个月内，我是否适合离开目前岗位？'],['推进具体项目','未来三个月，这个具体项目是否适合继续推进？']],
  wealth:[['参与这笔交易','未来一个月，我是否适合参与这笔具体交易？'],['等待对方回款','对方能否在约定期限内支付这笔款项？'],['投入这笔资金','未来三个月，我是否适合把这笔资金投入目前的项目？']],
  love:[['明确恋爱关系','未来三个月，我和对方是否适合明确恋爱关系？'],['争取复合','未来三个月，我是否适合主动争取与对方复合？'],['关系稳定发展','未来三个月，我和对方的关系能否稳定发展？']],
  cooperation:[['签订合作','我是否适合在本月与对方签订这项合作？'],['继续合作','未来三个月，我是否适合继续与对方合作这个项目？'],['接受当前条件','我是否适合接受对方目前提出的合作条件？']],
  travel:[['按计划出行','这次具体行程是否适合按原计划出发？'],['选择出发日期','我是否适合在目前选定的日期出发？'],['迁居或调动','未来三个月，我是否适合完成这次迁居或工作调动？']],
  lost:[['能否找回','这件遗失物品能否在七天内找回？'],['是否仍在室内','这件遗失物品是否仍在最后出现的室内地点？'],['是否由熟人取得','这件遗失物品是否被熟悉的人拿走？']],
  other:[['是否继续推进','未来三个月，这件具体事情是否适合继续推进？'],['是否接受方案','我是否适合接受目前这个具体方案？'],['能否按期完成','这件具体事情能否在约定期限内完成？']]
};
var AI_QUICK_QUESTIONS=['用神为什么这样选？','反方证据是什么？','应期依据是什么？','现实中应该观察什么？'];

function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nl(value){return esc(value).replace(/\n/g,'<br>')}
function setStatus(id,text,error){var el=document.getElementById(id);el.textContent=text||'';el.classList.toggle('error',!!error)}
function nowShanghai(){
  var parts=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  var map={};parts.forEach(function(part){map[part.type]=part.value});
  return map.year+'-'+map.month+'-'+map.day+'T'+map.hour+':'+map.minute;
}
function useCurrentTime(){document.getElementById('castTime').value=nowShanghai()}
function renderQuestionTemplates(){
  var type=document.getElementById('questionType').value,templates=QUESTION_TEMPLATES[type]||QUESTION_TEMPLATES.other;
  document.getElementById('questionTemplates').innerHTML=templates.map(function(item,index){return '<button type="button" onclick="applyQuestionTemplate('+index+')"><b>'+esc(item[0])+'</b></button>'}).join('')
}
function applyQuestionTemplate(index){
  var templates=QUESTION_TEMPLATES[document.getElementById('questionType').value]||QUESTION_TEMPLATES.other,item=templates[index];if(!item)return;
  var input=document.getElementById('question');input.value=item[1];inspectQuestion();input.focus()
}
function questionScopeIssue(question){
  var q=String(question||'').trim(),decisions=q.match(/是否|能否|会不会|要不要|该不该|适不适合/g)||[];
  if(!q)return '';
  if(/^(我|本人|最近|未来)?的?(事业|工作|财运|感情|婚姻|运势|未来|人生)(怎么样|如何|好不好|顺不顺)[？?。！!]*$/.test(q))return '问题比较宽泛。请补充一个时间范围和一个具体决定，例如“未来三个月是否适合接受这份工作”。';
  if(/[？?].+[？?]/.test(q)||decisions.length>1||/(以及|同时|另外|还有|并且|顺便)/.test(q))return '这个问题可能包含两件以上的事。建议拆开，只保留同一人、同一事、同一决定。';
  if(q.length>180)return '问题背景较长，可能混入多件事。建议把背景留给后续追问，起卦问题只保留一个具体决定。';
  return ''
}
function inspectQuestion(){
  var issue=questionScopeIssue(document.getElementById('question').value),box=document.getElementById('questionGuidance');box.hidden=!issue;
  document.getElementById('questionGuidanceText').textContent=issue;document.getElementById('questionScopeConfirm').checked=false
}
function askerLabel(record){
  var asker=record.asker||{},parts=[asker.mode==='other'?'代录他人卦象':'本人求测'];
  if(asker.name)parts.push(asker.name);if(asker.gender)parts.push(asker.gender);return parts.join(' · ')
}
function renderQuestionSummary(){
  if(!currentRecord)return;
  var box=document.getElementById('questionSummary'),time=currentRecord.castTime&&currentRecord.castTime.input||'',source=SOURCE_LABELS[currentRecord.source]||currentRecord.source||'';
  document.getElementById('questionEditor').hidden=true;box.hidden=false;document.getElementById('castHome').classList.add('has-plate');
  box.innerHTML='<div class="question-summary-head"><div><div class="eyebrow">01 / 问事</div><h2>问事已锁定</h2></div><span class="summary-state '+(openedFromHistory?'history':'')+'">'+(openedFromHistory?'历史快照':'已成卦')+'</span></div>'+
    '<p class="question-clamp">'+esc(currentRecord.question)+'</p>'+
